# Curtain Drive -- ESPHome firmware for the rev C board
# (ESP32-WROOM-32 + L298, sensorless end stops via motor current).
# The rev A/B firmware (ESP32-C3 + DRV8876) was firmware/curtain-drive.yaml; it is
# in git history up to commit 260a216.
#
# Pin map (see hardware-revC/curtain-drive-revC.kicad_sch; chosen so the single-sided
# board routes without crossings):
#   GPIO32 M_IN1     L298 IN1 (PWM), 10k pull-down        GPIO33 M_IN2  L298 IN2 (PWM), 10k pull-down
#   GPIO39 I_SENSE   1 ohm under L298 bridge A -> 1.0 V per A of motor current (ADC1)
#   GPIO36 VM_SENSE  12 V rail / vm_divider (46.4k : 8.25k) (ADC1)
#   GPIO23 status LED (active high)                       GPIO0  BOOT button
#   GPIO4  USER button (active low)                       GPIO19 SDA, GPIO21 SCL (optional AS5600 encoder)
#   GPIO1/GPIO3 UART0 on J5: flashing and the serial log
# The L298's EnA is tied high: IN1 = IN2 = low brakes the motor, which is also what the
# pull-downs hold while the module boots.
#
# First flash: USB-serial adapter on J5 (TX, RX, GND), 12 V on J1, hold BOOT, tap RESET,
# release BOOT, then `esphome run curtain-drive-revc.yaml`. After that, OTA over Wi-Fi.
#
# End stop principle: all of bridge A's current returns through the 1 ohm sense resistor. Along the
# track the curtain draws well under an amp; when the carriage hits the end clamp the
# motor stalls and the current jumps past `stall_current` within a few tens of ms.
# The control loop samples the ADC every 20 ms, ramps the PWM in over the soft-start time,
# ignores stalls during the startup blanking (which must end after the start spike that
# follows the ramp) and stops after 3 consecutive samples over the threshold.
# That event is the end stop: it re-homes the position estimate to 0 % or 100 %.
# Between the ends the position is dead-reckoned from run time and re-synced at
# every end, exactly like a time-based cover with switches -- minus the switches.
#
# Tuning: http://curtain-drive.local (or the board's IP) is a dashboard with live graphs,
# the peak and stop current of every run, and sliders for the values below. Slider
# changes apply at once and survive a reboot; the substitutions are only the defaults.
# "Reverse direction" swaps the motor leads in software, for when the panels are clamped
# to the other runs of the cord loop (Open closes). "Travel time" can be typed in, or
# measured by "Calibrate travel".

substitutions:
  name: curtain-drive
  friendly_name: Curtain Drive
  stall_current: "1.0"        # A   -- set halfway between running and stalled current; converted DM-S2000MD: ~0.55 A running, ~1.5 A stalled
  duty_max: "50"              # %   -- 12 V bus, 6 V rated motor -> 50 % duty (the L298 drops ~2 V: raise if slow)
  duty_slow: "30"             # %   -- approach speed for the last 10 % of travel
  travel_time_ms: "20000"     # full open<->close time, re-measured by the calibrate button
  ramp_ms: "300"              # soft start: duty ramps from 0 to full over this time
  inrush_mask_ms: "800"       # startup blanking: no stall check until this long after start.
                              # The DM-S2000MD's start spike peaks ~0.75 A at 300-350 ms (right
                              # when the ramp hits full duty) and is gone by ~450 ms.
  stall_samples: "3"          # consecutive 20 ms samples over stall_current before stopping
  vm_divider: "6.624"         # (46.4k + 8.25k) / 8.25k

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(m_in1).update_frequency(id(n_pwm_hz).state);
          id(m_in2).update_frequency(id(n_pwm_hz).state);

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Caps the TX current peaks the LM317 rail has to ride through; this alone stopped
  # the Wi-Fi boot loop on the esp32-solder-test board. Raise it only if range is short.
  output_power: 8.5dB
  ap:
    ssid: "Curtain Drive"
captive_portal:

web_server:
  port: 80
  version: 3
  js_url: ""                  # replace the stock UI ...
  js_include: dashboard.js    # ... with the tuning dashboard (big graphs, compact log)
  sorting_groups:
    - id: grp_live
      name: "Live"
      sorting_weight: 10
    - id: grp_tune
      name: "Tuning"
      sorting_weight: 20
    - id: grp_diag
      name: "Diagnostics"
      sorting_weight: 30

status_led:
  pin:
    number: GPIO23

globals:
  - id: g_pos            # 0.0 = closed, 1.0 = open
    type: float
    initial_value: "0.0"
  - id: g_target
    type: float
    initial_value: "0.0"
  - id: g_dir            # +1 opening, -1 closing, 0 stopped
    type: int
    initial_value: "0"
  - id: g_start_ms
    type: uint32_t
    initial_value: "0"
  - id: g_last_ms
    type: uint32_t
    initial_value: "0"
  - id: g_stall_n
    type: int
    initial_value: "0"
  - id: g_travel_ms
    type: uint32_t
    restore_value: true
    initial_value: "${travel_time_ms}"
  - id: g_homing         # run until stall no matter what the estimate says
    type: bool
    initial_value: "false"
  - id: g_calibrating
    type: bool
    initial_value: "false"
  - id: g_teaching       # "Teach travel": opening from closed, timed until the second press
    type: bool
    initial_value: "false"
  - id: g_peak           # highest current of the current run, after the inrush mask
    type: float
    initial_value: "0.0"
  - id: g_duty           # PWM duty applied right now, 0..1 (for the dashboard)
    type: float
    initial_value: "0.0"

output:
  - platform: ledc
    id: m_in1
    pin: GPIO32
    frequency: 20000 Hz
  - platform: ledc
    id: m_in2
    pin: GPIO33
    frequency: 20000 Hz

binary_sensor:
  - platform: gpio
    id: user_button
    name: "User button"
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    web_server:
      sorting_group_id: grp_diag
    on_click:
      - min_length: 50ms
        max_length: 800ms
        then:
          - lambda: |-
              if (id(g_dir) != 0) { id(last_stop).publish_state("stopped by hand (USER button)"); id(motor_stop).execute(); }
              else if (id(g_pos) < 0.5) { id(curtain).make_call().set_command_open().perform(); }
              else { id(curtain).make_call().set_command_close().perform(); }
      - min_length: 2s
        max_length: 6s
        then:
          - script.execute: calibrate

sensor:
  - platform: adc
    id: i_sense
    name: "Motor current"
    pin: GPIO39
    attenuation: 12db
    update_interval: 100ms       # 10 points/s on the dashboard graph
    unit_of_measurement: "A"
    accuracy_decimals: 2
    web_server:
      sorting_group_id: grp_live
      sorting_weight: 1
    filters:
      - multiply: 1.0            # 1 ohm sense resistor -> 1 V per A
  - platform: template
    id: peak_current
    name: "Peak current (last run)"
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: never
    web_server:
      sorting_group_id: grp_live
      sorting_weight: 2
  - platform: template
    id: stop_current
    name: "Current at last stall stop"
    unit_of_measurement: "A"
    accuracy_decimals: 2
    update_interval: never
    web_server:
      sorting_group_id: grp_live
      sorting_weight: 3
  - platform: template
    id: duty_now
    name: "Motor duty"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 250ms
    lambda: |-
      return 100.0f * id(g_duty);
    filters:
      - delta: 1.0
    web_server:
      sorting_group_id: grp_live
      sorting_weight: 4
  - platform: adc
    id: vm_sense
    name: "Supply voltage"
    pin: GPIO36
    attenuation: 12db
    update_interval: 10s
    unit_of_measurement: "V"
    accuracy_decimals: 1
    web_server:
      sorting_group_id: grp_diag
    filters:
      - multiply: ${vm_divider}

text_sensor:
  - platform: template
    id: last_stop
    name: "Last stop reason"
    update_interval: never
    web_server:
      sorting_group_id: grp_live
      sorting_weight: 5

number:
  - platform: template
    id: n_stall_current
    name: "Stall threshold"
    unit_of_measurement: "A"
    min_value: 0.3
    max_value: 3.0
    step: 0.05
    initial_value: ${stall_current}
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
    web_server:
      sorting_group_id: grp_tune
      sorting_weight: 1
  - platform: template
    id: n_stall_samples
    name: "Stall samples (x20 ms)"
    min_value: 1
    max_value: 25
    step: 1
    initial_value: ${stall_samples}
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
    web_server:
      sorting_group_id: grp_tune
      sorting_weight: 2
  - platform: template
    id: n_duty_max
    name: "Speed (duty)"
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 5
    initial_value: ${duty_max}
    restore_value: true
    optimistic: true
    mode: slider
    entity_category: config
    web_server:
      sorting_group_id: grp_tune
      sorting_weight: 3
  - platform: template
    id: n_duty_slow
    name: "Approach speed (last 10 %)"
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 5
    initial_value: ${duty_slow}
    restore_value: true
    optimistic: true
    mode: slider
    entity_category: config
    web_server:
      sorting_group_id: grp_tune
      sorting_weight: 4
  - platform: template
    id: n_ramp_ms
    name: "Soft start"
    unit_of_measurement: "ms"
    min_value: 0
    max_value: 2000
    step: 50
    initial_value: ${ramp_ms}
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
    web_server:
      sorting_group_id: grp_tune
      sorting_weight: 5
  - platform: template
    id: n_travel_s
    name: "Travel time"
    unit_of_measurement: "s"
    min_value: 3
    max_value: 120
    step: 0.1
    mode: box
    entity_category: config
    # g_travel_ms is the stored value (restore_value), so a typed value and a calibrated
    # one both survive a reboot.
    lambda: return id(g_travel_ms) / 1000.0f;
    update_interval: 2s
    set_action:
      - lambda: |-
          id(g_travel_ms) = (uint32_t) (x * 1000.0f);
          ESP_LOGI("curtain", "travel time set to %u ms", id(g_travel_ms));
    web_server:
      sorting_group_id: grp_tune
      sorting_weight: 7
  # Motor PWM frequency. 20 kHz is above hearing; the L298 switches slowly, so going much
  # higher costs heat. Lower values make the motor whine at that pitch.
  - platform: template
    id: n_pwm_hz
    name: "PWM frequency"
    unit_of_measurement: "Hz"
    min_value: 1000
    max_value: 40000
    step: 500
    initial_value: 20000
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
    set_action:
      - lambda: |-
          id(m_in1).update_frequency(x);
          id(m_in2).update_frequency(x);
    web_server:
      sorting_group_id: grp_tune
      sorting_weight: 9
  - platform: template
    id: n_inrush_ms
    name: "Startup blanking"
    unit_of_measurement: "ms"
    min_value: 100
    max_value: 3000
    step: 50
    initial_value: ${inrush_mask_ms}
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config
    web_server:
      sorting_group_id: grp_tune
      sorting_weight: 6

switch:
  - platform: template
    id: sw_reverse
    name: "Reverse direction"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    web_server:
      sorting_group_id: grp_tune
      sorting_weight: 0
    # Stop first: flipping the leads mid-run would drive the motor the wrong way.
    turn_on_action:
      - script.execute: motor_stop
    turn_off_action:
      - script.execute: motor_stop

  # On: Open/Close run on until the motor stalls at the end (re-homes the position every
  # time). Off: they stop where the travel time says the end is -- gentler on the mounts,
  # but the estimate drifts, so use the Mark buttons to correct it now and then.
  - platform: template
    id: sw_stall_ends
    name: "Stall at the ends"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    web_server:
      sorting_group_id: grp_tune
      sorting_weight: 8

button:
  # Press with the curtain closed: it opens at full speed (no approach slow-down, no
  # timeout). Press again when it is fully open: that run time becomes the travel time.
  # A stall at the open end ends the teach run the same way.
  - platform: template
    name: "Teach travel"
    entity_category: config
    web_server:
      sorting_group_id: grp_tune
      sorting_weight: 12
    on_press:
      - lambda: |-
          if (!id(g_teaching)) {
            if (id(g_dir) != 0) id(motor_stop).execute();
            ESP_LOGI("curtain", "teach: opening from closed, press again when open");
            id(g_pos) = 0.0f;
            id(g_target) = 1.0f; id(g_homing) = true;
            id(motor_go).execute();
            id(g_teaching) = true;
            id(last_stop).publish_state("teaching: press Teach travel again when fully open");
          } else {
            const uint32_t t = millis() - id(g_start_ms);
            id(g_travel_ms) = t;
            id(g_pos) = 1.0f;
            ESP_LOGI("curtain", "teach: travel = %u ms", t);
            id(last_stop).publish_state(str_sprintf("travel taught: %.1f s", t / 1000.0f));
            id(motor_stop).execute();
            id(n_travel_s).publish_state(t / 1000.0f);
          }
  # "The curtain is fully open / closed right now": stops the motor and sets the position.
  # Pressed during a Teach travel run, "Mark fully open" also saves the travel time.
  - platform: template
    name: "Mark fully open"
    web_server:
      sorting_group_id: grp_live
      sorting_weight: 6
    on_press:
      - lambda: |-
          if (id(g_teaching)) {
            const uint32_t t = millis() - id(g_start_ms);
            id(g_travel_ms) = t;
            id(n_travel_s).publish_state(t / 1000.0f);
            id(last_stop).publish_state(str_sprintf("marked open, travel taught: %.1f s", t / 1000.0f));
          } else {
            id(last_stop).publish_state("marked fully open by hand");
          }
          id(motor_stop).execute();
          id(g_pos) = 1.0f;
          id(curtain).publish_state();
  - platform: template
    name: "Mark fully closed"
    web_server:
      sorting_group_id: grp_live
      sorting_weight: 7
    on_press:
      - lambda: |-
          id(last_stop).publish_state("marked fully closed by hand");
          id(motor_stop).execute();
          id(g_pos) = 0.0f;
          id(curtain).publish_state();
  - platform: template
    name: "Calibrate travel"
    entity_category: config
    web_server:
      sorting_group_id: grp_tune
      sorting_weight: 11
    on_press:
      - script.execute: calibrate
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
    web_server:
      sorting_group_id: grp_diag

cover:
  - platform: template
    id: curtain
    name: "Curtain"
    device_class: curtain
    has_position: true
    optimistic: false
    lambda: return id(g_pos);
    web_server:
      sorting_group_id: grp_live
      sorting_weight: 0
    open_action:
      - lambda: id(g_target) = 1.0; id(g_homing) = id(sw_stall_ends).state;
      - script.execute: motor_go
    close_action:
      - lambda: id(g_target) = 0.0; id(g_homing) = id(sw_stall_ends).state;
      - script.execute: motor_go
    position_action:
      - lambda: |-
          id(g_target) = pos;
          id(g_homing) = (pos <= 0.0f || pos >= 1.0f) && id(sw_stall_ends).state;
      - script.execute: motor_go
    stop_action:
      - lambda: if (id(g_dir) != 0) id(last_stop).publish_state("stopped from the dashboard / HA");
      - script.execute: motor_stop

script:
  # Start moving towards g_target. Duty is ramped by the 20 ms loop.
  - id: motor_go
    mode: restart
    then:
      - lambda: |-
          float diff = id(g_target) - id(g_pos);
          if (fabsf(diff) < 0.01f && !id(g_homing)) { id(motor_stop).execute(); return; }
          id(g_dir) = diff >= 0 ? 1 : -1;
          id(g_start_ms) = millis();
          id(g_last_ms) = id(g_start_ms);
          id(g_stall_n) = 0;
          id(g_peak) = 0.0f;
          id(curtain).current_operation = id(g_dir) > 0 ? COVER_OPERATION_OPENING : COVER_OPERATION_CLOSING;
          id(curtain).publish_state();
          ESP_LOGI("curtain", "move %s from %.2f to %.2f", id(g_dir) > 0 ? "OPEN" : "CLOSE", id(g_pos), id(g_target));

  - id: motor_stop
    then:
      - lambda: |-
          id(m_in1).set_level(0.0f);
          id(m_in2).set_level(0.0f);
          if (id(g_dir) != 0) id(peak_current).publish_state(id(g_peak));
          id(g_dir) = 0;
          id(g_duty) = 0.0f;
          id(g_homing) = false;
          id(g_teaching) = false;
          id(curtain).current_operation = COVER_OPERATION_IDLE;
          id(curtain).publish_state();

  # Full close (stall) -> full open (stall), timing the second leg.
  - id: calibrate
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("curtain", "calibration: closing to the end stop");
          id(g_calibrating) = false;
          id(g_target) = 0.0; id(g_homing) = true;
          id(motor_go).execute();
      - wait_until:
          condition:
            lambda: return id(g_dir) == 0;
          timeout: 90s
      - delay: 500ms
      - lambda: |-
          ESP_LOGI("curtain", "calibration: opening, timing the travel");
          id(g_calibrating) = true;
          id(g_target) = 1.0; id(g_homing) = true;
          id(motor_go).execute();
      - wait_until:
          condition:
            lambda: return id(g_dir) == 0;
          timeout: 90s
      - lambda: |-
          id(g_calibrating) = false;
          ESP_LOGI("curtain", "calibration done: travel = %u ms", id(g_travel_ms));

interval:
  - interval: 20ms
    then:
      - lambda: |-
          if (id(g_dir) == 0) return;
          const uint32_t now = millis();
          const uint32_t since_start = now - id(g_start_ms);
          const uint32_t dt = now - id(g_last_ms);
          id(g_last_ms) = now;

          // ---- dead-reckoned position ----
          // The travel time is taught at full speed (Speed (duty)); during the soft start and
          // the slow approach the curtain moves proportionally slower. g_duty is the duty
          // that was applied over the last dt.
          const float full = std::max(id(n_duty_max).state / 100.0f, 0.05f);
          float step = (float)dt / (float)id(g_travel_ms) * std::min(id(g_duty) / full, 1.0f);
          id(g_pos) = clamp(id(g_pos) + id(g_dir) * step, 0.0f, 1.0f);

          // ---- speed: ramp in, slow down near a known end ----
          const uint32_t ramp_ms = (uint32_t) id(n_ramp_ms).state;
          // Blanking always runs at least 200 ms past the end of the ramp: the start spike
          // comes when the motor first gets full duty, not while it ramps.
          const uint32_t blank_ms = std::max((uint32_t) id(n_inrush_ms).state, ramp_ms + 200);
          float duty = id(n_duty_max).state / 100.0f;
          if (since_start < ramp_ms) duty *= (float)since_start / ramp_ms;
          float remaining = id(g_dir) > 0 ? (1.0f - id(g_pos)) : id(g_pos);
          // No slow approach when running into an end stop on purpose: at low duty the
          // stalled motor draws less than the stall threshold and the end is never seen.
          if (remaining < 0.10f && !id(g_homing) && !id(g_teaching) && !id(g_calibrating)) duty = std::min(duty, id(n_duty_slow).state / 100.0f);
          id(g_duty) = duty;
          // "Reverse direction" swaps the bridge outputs; g_pos still means 0 closed, 1 open.
          const bool fwd = (id(g_dir) > 0) != id(sw_reverse).state;
          if (fwd) { id(m_in1).set_level(duty); id(m_in2).set_level(0.0f); }
          else     { id(m_in1).set_level(0.0f); id(m_in2).set_level(duty); }

          // ---- stall detection = end stop / obstruction ----
          float amps = id(i_sense).sample();      // 1 V per A
          if (since_start > blank_ms) {
            if (amps > id(g_peak)) id(g_peak) = amps;
            id(g_stall_n) = (amps > id(n_stall_current).state) ? id(g_stall_n) + 1 : 0;
            if (id(g_stall_n) >= (int) id(n_stall_samples).state) {
              id(stop_current).publish_state(amps);
              bool at_end = remaining < 0.15f || id(g_homing);
              if (at_end) {
                id(g_pos) = id(g_dir) > 0 ? 1.0f : 0.0f;
                if (id(g_calibrating) || id(g_teaching)) id(g_travel_ms) = since_start;
                ESP_LOGI("curtain", "end stop (%.2f A) -> position %.0f", amps, id(g_pos));
                id(last_stop).publish_state(str_sprintf("end stop %s at %.2f A", id(g_dir) > 0 ? "open" : "closed", amps));
              } else {
                ESP_LOGW("curtain", "obstruction at %.2f (%.2f A), stopping", id(g_pos), amps);
                id(last_stop).publish_state(str_sprintf("obstruction at %.0f %% (%.2f A)", id(g_pos) * 100.0f, amps));
              }
              id(motor_stop).execute();
              return;
            }
          }

          // teaching: the position estimate is meaningless until the second press
          if (id(g_teaching)) { id(g_pos) = 0.5f; if (since_start > 120000) { id(last_stop).publish_state("teach: no stop within 120 s"); id(motor_stop).execute(); } return; }

          // ---- target reached (not when homing: run into the end on purpose) ----
          if (!id(g_homing) && ((id(g_dir) > 0 && id(g_pos) >= id(g_target)) ||
                                (id(g_dir) < 0 && id(g_pos) <= id(g_target)))) {
            id(last_stop).publish_state(str_sprintf("reached %.0f %%", id(g_pos) * 100.0f));
            id(motor_stop).execute();
            return;
          }
          // safety: never run longer than 1.5x the travel time
          // (a calibration run may be much longer than the old travel time: allow 120 s)
          if (since_start > (id(g_calibrating) ? 120000u : id(g_travel_ms) * 3 / 2)) {
            ESP_LOGW("curtain", "timeout without stall, stopping");
            id(last_stop).publish_state("timeout: no stall within 1.5x travel time");
            id(motor_stop).execute();
          }
  - interval: 200ms
    then:
      - lambda: if (id(g_dir) != 0) id(curtain).publish_state();

# Optional AS5600 magnetic encoder on the pulley shaft (J4). Uncomment to use it and
