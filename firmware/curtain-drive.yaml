# Curtain Drive -- ESPHome firmware for the curtain-drive board
# (ESP32-C3-WROOM-02 + DRV8876, sensorless end stops via motor current).
#
# Pin map (see hardware/curtain-drive.kicad_sch):
#   GPIO4  M_IN1     DRV8876 IN1 (PWM)          GPIO5  M_IN2   DRV8876 IN2 (PWM)
#   GPIO6  M_nSLEEP  driver enable (high = on)  GPIO7  M_nFAULT driver fault, open drain, active low
#   GPIO3  I_SENSE   IPROPI x 1 k -> 1.0 V per A of motor current
#   GPIO1  VM_SENSE  12 V rail / 6.73 (47k : 8.2k)
#   GPIO8  status LED (active low)              GPIO9  BOOT button
#   GPIO20 USER button (active low)             GPIO10 SDA, GPIO2 SCL (optional AS5600 encoder)
#
# End stop principle: the DRV8876 mirrors the motor current onto IPROPI. Along the
# track the curtain draws well under an amp; when the carriage hits the end clamp the
# motor stalls and the current jumps past `stall_current` within a few tens of ms.
# The control loop samples the ADC every 20 ms, ignores the first 300 ms (inrush,
# the PWM is ramped anyway) and stops after 3 consecutive samples over the threshold.
# That event is the end stop: it re-homes the position estimate to 0 % or 100 %.
# Between the ends the position is dead-reckoned from run time and re-synced at
# every end, exactly like a time-based cover with switches -- minus the switches.

substitutions:
  name: curtain-drive
  friendly_name: Curtain Drive
  stall_current: "1.8"        # A   -- set halfway between running and stalled current (log "Motor current")
  duty_max: "0.50"            # 12 V bus, 6 V rated motor -> 50 % duty
  duty_slow: "0.30"           # approach speed for the last 10 % of travel
  travel_time_ms: "20000"     # full open<->close time, re-measured by the calibrate button
  inrush_mask_ms: "300"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - switch.turn_on: drv_enable

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Curtain Drive"
captive_portal:

status_led:
  pin:
    number: GPIO8
    inverted: true

globals:
  - id: g_pos            # 0.0 = closed, 1.0 = open
    type: float
    initial_value: "0.0"
  - id: g_target
    type: float
    initial_value: "0.0"
  - id: g_dir            # +1 opening, -1 closing, 0 stopped
    type: int
    initial_value: "0"
  - id: g_start_ms
    type: uint32_t
    initial_value: "0"
  - id: g_last_ms
    type: uint32_t
    initial_value: "0"
  - id: g_stall_n
    type: int
    initial_value: "0"
  - id: g_travel_ms
    type: uint32_t
    restore_value: true
    initial_value: "${travel_time_ms}"
  - id: g_homing         # run until stall no matter what the estimate says
    type: bool
    initial_value: "false"
  - id: g_calibrating
    type: bool
    initial_value: "false"

output:
  - platform: ledc
    id: m_in1
    pin: GPIO4
    frequency: 20000 Hz
  - platform: ledc
    id: m_in2
    pin: GPIO5
    frequency: 20000 Hz

switch:
  - platform: gpio
    id: drv_enable
    name: "Driver enable"
    pin: GPIO6
    restore_mode: ALWAYS_ON
    entity_category: config

binary_sensor:
  - platform: gpio
    name: "Driver fault"
    pin:
      number: GPIO7
      inverted: true
    device_class: problem
    on_press:
      - script.execute: motor_stop
  - platform: gpio
    id: user_button
    name: "User button"
    pin:
      number: GPIO20
      mode:
        input: true
        pullup: true
      inverted: true
    on_click:
      - min_length: 50ms
        max_length: 800ms
        then:
          - lambda: |-
              if (id(g_dir) != 0) { id(motor_stop).execute(); }
              else if (id(g_pos) < 0.5) { id(curtain).make_call().set_command_open().perform(); }
              else { id(curtain).make_call().set_command_close().perform(); }
      - min_length: 2s
        max_length: 6s
        then:
          - script.execute: calibrate

sensor:
  - platform: adc
    id: i_sense
    name: "Motor current"
    pin: GPIO3
    attenuation: 12db
    update_interval: 250ms
    unit_of_measurement: "A"
    accuracy_decimals: 2
    filters:
      - multiply: 1.0            # 1 k on IPROPI, 1000 uA/A -> 1 V per A
  - platform: adc
    id: vm_sense
    name: "Supply voltage"
    pin: GPIO1
    attenuation: 12db
    update_interval: 10s
    unit_of_measurement: "V"
    accuracy_decimals: 1
    filters:
      - multiply: 6.732          # (47k + 8.2k) / 8.2k
  - platform: template
    name: "Travel time"
    unit_of_measurement: "s"
    accuracy_decimals: 1
    entity_category: diagnostic
    lambda: return id(g_travel_ms) / 1000.0;
    update_interval: 60s

button:
  - platform: template
    name: "Calibrate travel"
    entity_category: config
    on_press:
      - script.execute: calibrate
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

cover:
  - platform: template
    id: curtain
    name: "Curtain"
    device_class: curtain
    has_position: true
    optimistic: false
    lambda: return id(g_pos);
    open_action:
      - lambda: id(g_target) = 1.0; id(g_homing) = true;
      - script.execute: motor_go
    close_action:
      - lambda: id(g_target) = 0.0; id(g_homing) = true;
      - script.execute: motor_go
    position_action:
      - lambda: |-
          id(g_target) = pos;
          id(g_homing) = (pos <= 0.0f || pos >= 1.0f);
      - script.execute: motor_go
    stop_action:
      - script.execute: motor_stop

script:
  # Start moving towards g_target. Duty is ramped by the 20 ms loop.
  - id: motor_go
    mode: restart
    then:
      - lambda: |-
          float diff = id(g_target) - id(g_pos);
          if (fabsf(diff) < 0.01f && !id(g_homing)) { id(motor_stop).execute(); return; }
          id(g_dir) = diff >= 0 ? 1 : -1;
          id(g_start_ms) = millis();
          id(g_last_ms) = id(g_start_ms);
          id(g_stall_n) = 0;
          id(curtain).current_operation = id(g_dir) > 0 ? COVER_OPERATION_OPENING : COVER_OPERATION_CLOSING;
          id(curtain).publish_state();
          ESP_LOGI("curtain", "move %s from %.2f to %.2f", id(g_dir) > 0 ? "OPEN" : "CLOSE", id(g_pos), id(g_target));

  - id: motor_stop
    then:
      - lambda: |-
          id(m_in1).set_level(0.0f);
          id(m_in2).set_level(0.0f);
          id(g_dir) = 0;
          id(g_homing) = false;
          id(curtain).current_operation = COVER_OPERATION_IDLE;
          id(curtain).publish_state();

  # Full close (stall) -> full open (stall), timing the second leg.
  - id: calibrate
    mode: single
    then:
      - lambda: |-
          ESP_LOGI("curtain", "calibration: closing to the end stop");
          id(g_calibrating) = false;
          id(g_target) = 0.0; id(g_homing) = true;
          id(motor_go).execute();
      - wait_until:
          condition:
            lambda: return id(g_dir) == 0;
          timeout: 90s
      - delay: 500ms
      - lambda: |-
          ESP_LOGI("curtain", "calibration: opening, timing the travel");
          id(g_calibrating) = true;
          id(g_target) = 1.0; id(g_homing) = true;
          id(motor_go).execute();
      - wait_until:
          condition:
            lambda: return id(g_dir) == 0;
          timeout: 90s
      - lambda: |-
          id(g_calibrating) = false;
          ESP_LOGI("curtain", "calibration done: travel = %u ms", id(g_travel_ms));

interval:
  - interval: 20ms
    then:
      - lambda: |-
          if (id(g_dir) == 0) return;
          const uint32_t now = millis();
          const uint32_t since_start = now - id(g_start_ms);
          const uint32_t dt = now - id(g_last_ms);
          id(g_last_ms) = now;

          // ---- dead-reckoned position ----
          float step = (float)dt / (float)id(g_travel_ms);
          id(g_pos) = clamp(id(g_pos) + id(g_dir) * step, 0.0f, 1.0f);

          // ---- speed: ramp in, slow down near a known end ----
          float duty = ${duty_max};
          if (since_start < ${inrush_mask_ms}) duty *= (float)since_start / ${inrush_mask_ms};
          float remaining = id(g_dir) > 0 ? (1.0f - id(g_pos)) : id(g_pos);
          if (remaining < 0.10f) duty = std::min(duty, (float)${duty_slow});
          if (id(g_dir) > 0) { id(m_in1).set_level(duty); id(m_in2).set_level(0.0f); }
          else               { id(m_in1).set_level(0.0f); id(m_in2).set_level(duty); }

          // ---- stall detection = end stop / obstruction ----
          float amps = id(i_sense).sample();      // 1 V per A
          if (since_start > ${inrush_mask_ms}) {
            id(g_stall_n) = (amps > ${stall_current}) ? id(g_stall_n) + 1 : 0;
            if (id(g_stall_n) >= 3) {
              bool at_end = remaining < 0.15f || id(g_homing);
              if (at_end) {
                id(g_pos) = id(g_dir) > 0 ? 1.0f : 0.0f;
                if (id(g_calibrating)) id(g_travel_ms) = since_start;
                ESP_LOGI("curtain", "end stop (%.2f A) -> position %.0f", amps, id(g_pos));
              } else {
                ESP_LOGW("curtain", "obstruction at %.2f (%.2f A), stopping", id(g_pos), amps);
              }
              id(motor_stop).execute();
              return;
            }
          }

          // ---- target reached (not when homing: run into the end on purpose) ----
          if (!id(g_homing) && ((id(g_dir) > 0 && id(g_pos) >= id(g_target)) ||
                                (id(g_dir) < 0 && id(g_pos) <= id(g_target)))) {
            id(motor_stop).execute();
            return;
          }
          // safety: never run longer than 1.5x the travel time
          if (since_start > id(g_travel_ms) * 3 / 2) {
            ESP_LOGW("curtain", "timeout without stall, stopping");
            id(motor_stop).execute();
          }
  - interval: 200ms
    then:
      - lambda: if (id(g_dir) != 0) id(curtain).publish_state();

# Optional AS5600 magnetic encoder on the pulley shaft (J4). Uncomment to use it and
# replace the dead-reckoning with a real count.
# i2c:
#   sda: GPIO10
#   scl: GPIO2
#   frequency: 400kHz
# as5600:
#   id: encoder
# sensor:
#   - platform: as5600
#     as5600_id: encoder
#     name: "Pulley angle"
